<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 680" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Segoe UI, sans-serif">

  <!-- Background -->
  <rect width="960" height="680" fill="#0f0f0f" rx="12"/>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">Diagrama Entidad-Relación — CRM</text>
  <text x="480" y="58" text-anchor="middle" fill="#888" font-size="12">Base de datos: cec_crm · Motor: MySQL 8</text>

  <!-- ═══════════════════════════════════════════════
       TABLE: users  (center-top)
  ════════════════════════════════════════════════ -->
  <g id="tbl-users">
    <rect x="350" y="80" width="260" height="200" fill="#1a1a1a" stroke="#f97316" stroke-width="2" rx="8"/>
    <!-- header -->
    <rect x="350" y="80" width="260" height="32" fill="#f97316" rx="8"/>
    <rect x="350" y="100" width="260" height="12" fill="#f97316"/>
    <text x="480" y="102" text-anchor="middle" fill="#0f0f0f" font-size="13" font-weight="700">users</text>

    <!-- rows -->
    <line x1="350" y1="112" x2="610" y2="112" stroke="#333" stroke-width="1"/>
    <text x="365" y="128" fill="#fbbf24" font-size="11" font-weight="600">PK</text>
    <text x="395" y="128" fill="#e2e8f0" font-size="11">id</text>
    <text x="595" y="128" text-anchor="end" fill="#64748b" font-size="10">BIGINT AUTO</text>

    <line x1="350" y1="134" x2="610" y2="134" stroke="#222" stroke-width="1"/>
    <text x="395" y="150" fill="#e2e8f0" font-size="11">email</text>
    <text x="595" y="150" text-anchor="end" fill="#64748b" font-size="10">VARCHAR(180) UNIQUE</text>

    <line x1="350" y1="156" x2="610" y2="156" stroke="#222" stroke-width="1"/>
    <text x="395" y="172" fill="#e2e8f0" font-size="11">password_hash</text>
    <text x="595" y="172" text-anchor="end" fill="#64748b" font-size="10">VARCHAR(255)</text>

    <line x1="350" y1="178" x2="610" y2="178" stroke="#222" stroke-width="1"/>
    <text x="395" y="194" fill="#e2e8f0" font-size="11">name</text>
    <text x="595" y="194" text-anchor="end" fill="#64748b" font-size="10">VARCHAR(100)</text>

    <line x1="350" y1="200" x2="610" y2="200" stroke="#222" stroke-width="1"/>
    <text x="395" y="216" fill="#e2e8f0" font-size="11">role</text>
    <text x="595" y="216" text-anchor="end" fill="#64748b" font-size="10">ENUM(ADMIN,USER)</text>

    <line x1="350" y1="222" x2="610" y2="222" stroke="#222" stroke-width="1"/>
    <text x="395" y="238" fill="#e2e8f0" font-size="11">created_at</text>
    <text x="595" y="238" text-anchor="end" fill="#64748b" font-size="10">DATETIME</text>

    <line x1="350" y1="244" x2="610" y2="244" stroke="#222" stroke-width="1"/>
    <text x="395" y="260" fill="#e2e8f0" font-size="11">updated_at</text>
    <text x="595" y="260" text-anchor="end" fill="#64748b" font-size="10">DATETIME</text>
  </g>

  <!-- ═══════════════════════════════════════════════
       TABLE: contacts  (bottom-left)
  ════════════════════════════════════════════════ -->
  <g id="tbl-contacts">
    <rect x="30" y="380" width="260" height="230" fill="#1a1a1a" stroke="#22c55e" stroke-width="2" rx="8"/>
    <rect x="30" y="380" width="260" height="32" fill="#22c55e" rx="8"/>
    <rect x="30" y="400" width="260" height="12" fill="#22c55e"/>
    <text x="160" y="402" text-anchor="middle" fill="#0f0f0f" font-size="13" font-weight="700">contacts</text>

    <line x1="30" y1="412" x2="290" y2="412" stroke="#333" stroke-width="1"/>
    <text x="45" y="428" fill="#fbbf24" font-size="11" font-weight="600">PK</text>
    <text x="75" y="428" fill="#e2e8f0" font-size="11">id</text>
    <text x="275" y="428" text-anchor="end" fill="#64748b" font-size="10">BIGINT AUTO</text>

    <line x1="30" y1="434" x2="290" y2="434" stroke="#222" stroke-width="1"/>
    <text x="45" y="450" fill="#ef4444" font-size="11" font-weight="600">FK</text>
    <text x="75" y="450" fill="#e2e8f0" font-size="11">user_id</text>
    <text x="275" y="450" text-anchor="end" fill="#64748b" font-size="10">BIGINT NOT NULL</text>

    <line x1="30" y1="456" x2="290" y2="456" stroke="#222" stroke-width="1"/>
    <text x="75" y="472" fill="#e2e8f0" font-size="11">name</text>
    <text x="275" y="472" text-anchor="end" fill="#64748b" font-size="10">VARCHAR(100)</text>

    <line x1="30" y1="478" x2="290" y2="478" stroke="#222" stroke-width="1"/>
    <text x="75" y="494" fill="#e2e8f0" font-size="11">email</text>
    <text x="275" y="494" text-anchor="end" fill="#64748b" font-size="10">VARCHAR(180)</text>

    <line x1="30" y1="500" x2="290" y2="500" stroke="#222" stroke-width="1"/>
    <text x="75" y="516" fill="#e2e8f0" font-size="11">phone</text>
    <text x="275" y="516" text-anchor="end" fill="#64748b" font-size="10">VARCHAR(30)</text>

    <line x1="30" y1="522" x2="290" y2="522" stroke="#222" stroke-width="1"/>
    <text x="75" y="538" fill="#e2e8f0" font-size="11">stage</text>
    <text x="275" y="538" text-anchor="end" fill="#64748b" font-size="10">ENUM</text>

    <line x1="30" y1="544" x2="290" y2="544" stroke="#222" stroke-width="1"/>
    <text x="75" y="560" fill="#e2e8f0" font-size="11">notes</text>
    <text x="275" y="560" text-anchor="end" fill="#64748b" font-size="10">TEXT</text>

    <line x1="30" y1="566" x2="290" y2="566" stroke="#222" stroke-width="1"/>
    <text x="75" y="582" fill="#e2e8f0" font-size="11">created_at</text>
    <text x="275" y="582" text-anchor="end" fill="#64748b" font-size="10">DATETIME</text>

    <!-- ENUM note -->
    <text x="160" y="625" text-anchor="middle" fill="#4ade80" font-size="9">LEAD · PROSPECTO · CALIFICADO · CLIENTE · PERDIDO</text>
  </g>

  <!-- ═══════════════════════════════════════════════
       TABLE: companies  (bottom-center-left)
  ════════════════════════════════════════════════ -->
  <g id="tbl-companies">
    <rect x="330" y="380" width="260" height="210" fill="#1a1a1a" stroke="#3b82f6" stroke-width="2" rx="8"/>
    <rect x="330" y="380" width="260" height="32" fill="#3b82f6" rx="8"/>
    <rect x="330" y="400" width="260" height="12" fill="#3b82f6"/>
    <text x="460" y="402" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">companies</text>

    <line x1="330" y1="412" x2="590" y2="412" stroke="#333" stroke-width="1"/>
    <text x="345" y="428" fill="#fbbf24" font-size="11" font-weight="600">PK</text>
    <text x="375" y="428" fill="#e2e8f0" font-size="11">id</text>
    <text x="575" y="428" text-anchor="end" fill="#64748b" font-size="10">BIGINT AUTO</text>

    <line x1="330" y1="434" x2="590" y2="434" stroke="#222" stroke-width="1"/>
    <text x="345" y="450" fill="#ef4444" font-size="11" font-weight="600">FK</text>
    <text x="375" y="450" fill="#e2e8f0" font-size="11">user_id</text>
    <text x="575" y="450" text-anchor="end" fill="#64748b" font-size="10">BIGINT NOT NULL</text>

    <line x1="330" y1="456" x2="590" y2="456" stroke="#222" stroke-width="1"/>
    <text x="375" y="472" fill="#e2e8f0" font-size="11">name</text>
    <text x="575" y="472" text-anchor="end" fill="#64748b" font-size="10">VARCHAR(150)</text>

    <line x1="330" y1="478" x2="590" y2="478" stroke="#222" stroke-width="1"/>
    <text x="375" y="494" fill="#e2e8f0" font-size="11">industry</text>
    <text x="575" y="494" text-anchor="end" fill="#64748b" font-size="10">VARCHAR(80)</text>

    <line x1="330" y1="500" x2="590" y2="500" stroke="#222" stroke-width="1"/>
    <text x="375" y="516" fill="#e2e8f0" font-size="11">website</text>
    <text x="575" y="516" text-anchor="end" fill="#64748b" font-size="10">VARCHAR(255)</text>

    <line x1="330" y1="522" x2="590" y2="522" stroke="#222" stroke-width="1"/>
    <text x="375" y="538" fill="#e2e8f0" font-size="11">phone</text>
    <text x="575" y="538" text-anchor="end" fill="#64748b" font-size="10">VARCHAR(30)</text>

    <line x1="330" y1="544" x2="590" y2="544" stroke="#222" stroke-width="1"/>
    <text x="375" y="560" fill="#e2e8f0" font-size="11">notes</text>
    <text x="575" y="560" text-anchor="end" fill="#64748b" font-size="10">TEXT</text>

    <line x1="330" y1="566" x2="590" y2="566" stroke="#222" stroke-width="1"/>
    <text x="375" y="582" fill="#e2e8f0" font-size="11">created_at</text>
    <text x="575" y="582" text-anchor="end" fill="#64748b" font-size="10">DATETIME</text>
  </g>

  <!-- ═══════════════════════════════════════════════
       TABLE: deals  (bottom-center-right)
  ════════════════════════════════════════════════ -->
  <g id="tbl-deals">
    <rect x="630" y="340" width="290" height="250" fill="#1a1a1a" stroke="#f59e0b" stroke-width="2" rx="8"/>
    <rect x="630" y="340" width="290" height="32" fill="#f59e0b" rx="8"/>
    <rect x="630" y="360" width="290" height="12" fill="#f59e0b"/>
    <text x="775" y="362" text-anchor="middle" fill="#0f0f0f" font-size="13" font-weight="700">deals</text>

    <line x1="630" y1="372" x2="920" y2="372" stroke="#333" stroke-width="1"/>
    <text x="645" y="388" fill="#fbbf24" font-size="11" font-weight="600">PK</text>
    <text x="675" y="388" fill="#e2e8f0" font-size="11">id</text>
    <text x="905" y="388" text-anchor="end" fill="#64748b" font-size="10">BIGINT AUTO</text>

    <line x1="630" y1="394" x2="920" y2="394" stroke="#222" stroke-width="1"/>
    <text x="645" y="410" fill="#ef4444" font-size="11" font-weight="600">FK</text>
    <text x="675" y="410" fill="#e2e8f0" font-size="11">user_id</text>
    <text x="905" y="410" text-anchor="end" fill="#64748b" font-size="10">BIGINT NOT NULL</text>

    <line x1="630" y1="416" x2="920" y2="416" stroke="#222" stroke-width="1"/>
    <text x="675" y="432" fill="#e2e8f0" font-size="11">title</text>
    <text x="905" y="432" text-anchor="end" fill="#64748b" font-size="10">VARCHAR(200)</text>

    <line x1="630" y1="438" x2="920" y2="438" stroke="#222" stroke-width="1"/>
    <text x="675" y="454" fill="#e2e8f0" font-size="11">value</text>
    <text x="905" y="454" text-anchor="end" fill="#64748b" font-size="10">DECIMAL(14,2)</text>

    <line x1="630" y1="460" x2="920" y2="460" stroke="#222" stroke-width="1"/>
    <text x="675" y="476" fill="#e2e8f0" font-size="11">contact_name</text>
    <text x="905" y="476" text-anchor="end" fill="#64748b" font-size="10">VARCHAR(100)</text>

    <line x1="630" y1="482" x2="920" y2="482" stroke="#222" stroke-width="1"/>
    <text x="675" y="498" fill="#e2e8f0" font-size="11">stage</text>
    <text x="905" y="498" text-anchor="end" fill="#64748b" font-size="10">ENUM</text>

    <line x1="630" y1="504" x2="920" y2="504" stroke="#222" stroke-width="1"/>
    <text x="675" y="520" fill="#e2e8f0" font-size="11">close_date</text>
    <text x="905" y="520" text-anchor="end" fill="#64748b" font-size="10">DATE</text>

    <line x1="630" y1="526" x2="920" y2="526" stroke="#222" stroke-width="1"/>
    <text x="675" y="542" fill="#e2e8f0" font-size="11">notes</text>
    <text x="905" y="542" text-anchor="end" fill="#64748b" font-size="10">TEXT</text>

    <line x1="630" y1="548" x2="920" y2="548" stroke="#222" stroke-width="1"/>
    <text x="675" y="564" fill="#e2e8f0" font-size="11">created_at</text>
    <text x="905" y="564" text-anchor="end" fill="#64748b" font-size="10">DATETIME</text>

    <text x="775" y="610" text-anchor="middle" fill="#fcd34d" font-size="9">NUEVO · CONTACTADO · PROPUESTA · NEGOCIACION · GANADO · PERDIDO</text>
  </g>

  <!-- ═══════════════════════════════════════════════
       TABLE: tasks  (far right — moved to middle right area)
  ════════════════════════════════════════════════ -->
  <g id="tbl-tasks">
    <!-- tasks will be shown as a smaller table below deals in same column, but we'll place it overlapping below -->
    <!-- Actually let's place it at bottom-far-right, but the canvas is 960 wide so let's use x=630 area but pushed down -->
    <!-- Redesign: place tasks below the deals box -->
  </g>

  <!-- Since tasks would overflow, let's embed it as a panel below the deals title -->
  <!-- tasks table — placed far right slightly lower -->
  <rect x="630" y="80" width="290" height="240" fill="#1a1a1a" stroke="#a855f7" stroke-width="2" rx="8"/>
  <rect x="630" y="80" width="290" height="32" fill="#a855f7" rx="8"/>
  <rect x="630" y="100" width="290" height="12" fill="#a855f7"/>
  <text x="775" y="102" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">tasks</text>

  <line x1="630" y1="112" x2="920" y2="112" stroke="#333" stroke-width="1"/>
  <text x="645" y="128" fill="#fbbf24" font-size="11" font-weight="600">PK</text>
  <text x="675" y="128" fill="#e2e8f0" font-size="11">id</text>
  <text x="905" y="128" text-anchor="end" fill="#64748b" font-size="10">BIGINT AUTO</text>

  <line x1="630" y1="134" x2="920" y2="134" stroke="#222" stroke-width="1"/>
  <text x="645" y="150" fill="#ef4444" font-size="11" font-weight="600">FK</text>
  <text x="675" y="150" fill="#e2e8f0" font-size="11">user_id</text>
  <text x="905" y="150" text-anchor="end" fill="#64748b" font-size="10">BIGINT NOT NULL</text>

  <line x1="630" y1="156" x2="920" y2="156" stroke="#222" stroke-width="1"/>
  <text x="675" y="172" fill="#e2e8f0" font-size="11">title</text>
  <text x="905" y="172" text-anchor="end" fill="#64748b" font-size="10">VARCHAR(255)</text>

  <line x1="630" y1="178" x2="920" y2="178" stroke="#222" stroke-width="1"/>
  <text x="675" y="194" fill="#e2e8f0" font-size="11">type</text>
  <text x="905" y="194" text-anchor="end" fill="#64748b" font-size="10">ENUM</text>

  <line x1="630" y1="200" x2="920" y2="200" stroke="#222" stroke-width="1"/>
  <text x="675" y="216" fill="#e2e8f0" font-size="11">priority</text>
  <text x="905" y="216" text-anchor="end" fill="#64748b" font-size="10">ENUM</text>

  <line x1="630" y1="222" x2="920" y2="222" stroke="#222" stroke-width="1"/>
  <text x="675" y="238" fill="#e2e8f0" font-size="11">contact_name</text>
  <text x="905" y="238" text-anchor="end" fill="#64748b" font-size="10">VARCHAR(100)</text>

  <line x1="630" y1="244" x2="920" y2="244" stroke="#222" stroke-width="1"/>
  <text x="675" y="260" fill="#e2e8f0" font-size="11">due_date</text>
  <text x="905" y="260" text-anchor="end" fill="#64748b" font-size="10">DATE</text>

  <line x1="630" y1="266" x2="920" y2="266" stroke="#222" stroke-width="1"/>
  <text x="675" y="282" fill="#e2e8f0" font-size="11">done</text>
  <text x="905" y="282" text-anchor="end" fill="#64748b" font-size="10">BOOLEAN DEFAULT 0</text>

  <line x1="630" y1="288" x2="920" y2="288" stroke="#222" stroke-width="1"/>
  <text x="675" y="304" fill="#e2e8f0" font-size="11">notes / created_at</text>
  <text x="905" y="304" text-anchor="end" fill="#64748b" font-size="10">TEXT / DATETIME</text>

  <!-- ENUM notes for tasks -->
  <text x="775" y="330" text-anchor="middle" fill="#c4b5fd" font-size="9">type: LLAMADA · EMAIL · REUNION · SEGUIMIENTO · OTRO</text>
  <text x="775" y="344" text-anchor="middle" fill="#c4b5fd" font-size="9">priority: BAJA · NORMAL · ALTA · URGENTE</text>

  <!-- ═══════════════════════════════════════════════
       RELATIONSHIP LINES  (users 1 → N child tables)
  ════════════════════════════════════════════════ -->

  <!-- users → contacts -->
  <line x1="350" y1="230" x2="160" y2="380" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-red)"/>
  <text x="220" y="300" fill="#ef4444" font-size="10">1 : N</text>

  <!-- users → companies -->
  <line x1="480" y1="280" x2="460" y2="380" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-red)"/>
  <text x="495" y="330" fill="#ef4444" font-size="10">1 : N</text>

  <!-- users → deals -->
  <line x1="610" y1="200" x2="720" y2="340" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-red)"/>
  <text x="680" y="275" fill="#ef4444" font-size="10">1 : N</text>

  <!-- users → tasks -->
  <line x1="610" y1="150" x2="630" y2="150" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-red)"/>
  <text x="622" y="143" fill="#ef4444" font-size="10">1 : N</text>

  <!-- ═══════════════════════════════════════════════
       ARROWHEAD DEFS
  ════════════════════════════════════════════════ -->
  <defs>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Legend -->
  <rect x="30" y="645" width="12" height="12" fill="#fbbf24" rx="2"/>
  <text x="48" y="656" fill="#e2e8f0" font-size="11">PK — Clave primaria</text>

  <rect x="180" y="645" width="12" height="12" fill="#ef4444" rx="2"/>
  <text x="198" y="656" fill="#e2e8f0" font-size="11">FK — Clave foránea</text>

  <line x1="340" y1="651" x2="370" y2="651" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="378" y="656" fill="#e2e8f0" font-size="11">Relación 1:N</text>

  <text x="530" y="656" fill="#64748b" font-size="11">Todas las tablas: FK user_id; sin cascada declarada</text>

</svg>
